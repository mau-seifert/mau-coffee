server {
    index index.php index.html;
    server_name php-docker.local;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /app/public;

    # Serve files under /showcase/* normally, but route the /showcase root to the PHP router
    location ~ ^/showcase/.+ {
        try_files $uri =404;
    }

    # Serve post images (static assets)
    location ~ ^/posts/.+ {
        try_files $uri =404;
    }

    location = /showcase {
        rewrite ^ /index.php?route=/showcase last;
    }

    location = /showcase/ {
        rewrite ^ /index.php?route=/showcase last;
    }

    location / {
        try_files $uri $uri/ /index.php?route=$uri;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}